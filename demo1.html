<!DOCTYPE html>
<html>
<head>
    <title>Food Menu Explorer</title>
</head>
<body>
    <h1>Food Menu Explorer</h1>

    <!-- Food Image with Clickable Areas -->
    <img src="food-table.jpg" alt="Food Items" usemap="#foodmap" width="600">

    <!-- Define Image Map -->
    <map name="foodmap">
        <!-- Circle for Pizza -->
        <area shape="circle" coords="150,120,60" href="https://en.wikipedia.org/wiki/Pizza" alt="Pizza" target="_blank">

        <!-- Circle for Burger -->
        <area shape="circle" coords="350,130,50" href="https://en.wikipedia.org/wiki/Hamburger" alt="Burger" target="_blank">

        <!-- Rectangle for French Fries -->
        <area shape="rect" coords="450,200,550,300" href="https://en.wikipedia.org/wiki/French_fries" alt="French Fries" target="_blank">

        <!-- Rectangle for Menu Card -->
        <area shape="rect" coords="50,350,200,450" href="https://en.wikipedia.org/wiki/Menu" alt="Menu Card" target="_blank">

        <!-- Polygon for Sandwich -->
        <area shape="poly" coords="250,250,300,220,350,250,320,300" href="https://en.wikipedia.org/wiki/Sandwich" alt="Sandwich" target="_blank">

        <!-- Polygon for Cake Slice -->
        <area shape="poly" coords="400,350,450,330,500,370,450,400" href="https://en.wikipedia.org/wiki/Cake" alt="Cake Slice" target="_blank">

        <!-- Default Area -->
        <area shape="default" href="https://en.wikipedia.org/wiki/Food" alt="Other Food Items" target="_blank">
    </map>
</body>
</html>
