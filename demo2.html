<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Slip</title>
</head>
<body>
    <h1>Employee Salary Slip</h1>

    <!-- Earnings Table -->
    <h2>Earnings</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>Component</th>
            <th>Amount (₹)</th>
        </tr>
        <tr>
            <td>Basic Pay</td>
            <td>30,000</td>
        </tr>
        <tr>
            <td>HRA</td>
            <td>6,000</td>
        </tr>
        <tr>
            <td>DA</td>
            <td>4,000</td>
        </tr>
        <tr>
            <td><strong>Total Earnings</strong></td>
            <td><strong>40,000</strong></td>
        </tr>
    </table>

    <!-- Deductions Table -->
    <h2>Deductions</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>Component</th>
            <th>Amount (₹)</th>
        </tr>
        <tr>
            <td>PF</td>
            <td>2,000</td>
        </tr>
        <tr>
            <td>Tax</td>
            <td>1,500</td>
        </tr >
        <tr>
            <td>Loan</td>
            <td>1,000</td>
        </tr>
        <tr>
            <td><strong>Total Deductions</strong></td>
            <td><strong>4,500</strong></td>
        </tr>
    </table>

    <!-- Net Salary -->
    <h2>Net Salary</h2>
    <p><strong>40,000 - 4,500 = 35,500</strong></p>
</body>
</html>
